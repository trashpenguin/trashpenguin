name: Refresh contribution snake

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: trashpenguin
          outputs: |
            dist/snake.svg?color_snake=%23736bb3&color_dots=%23edf2f5,%23ccece2,%239cd9c8,%2367bba5,%233c907e
            dist/snake-dark.svg?palette=github-dark&color_snake=%23aaa4ef&color_dots=%231b2438,%2333484e,%234c796f,%2377b6a5,%239ce2ce
      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
